<html>

		<title>Ajouter un élève</title>
		<meta charset = "utf-8"/>

	<body>
		<h1>Ajouter un élève</h1>
        <div>
            <form method="post" action="ajouter_eleve.php">
            <table >
                <tr>
                    <td align="RIGHT">
                    <label for="prenom">Prénom : </label>
                    <input type="text" placeholder="saisir le prénom" id="prenom" name="prenom" required/>
                    </td>
                </tr>
                <tr>
                    <td align="RIGHT">
                    <label for="nom">Nom : </label>
                    <input type="text" placeholder="saisir le nom" id="nom" name="nom" required/>

                </tr>
                <tr>
                    <td align="RIGHT">
                    <label for="date_naissance">Date de naissance : </label>
                    <input type="date" id="date_naissance" name="date_naissance" required/>

                <tr>

                    </td>
                </tr>
            </table>
            </form>        
        </div>
	</body>
</html>
